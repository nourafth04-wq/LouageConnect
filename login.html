<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — LouageConnect</title>
    <link rel="stylesheet" href="css/main.css?v=2">
    <script src="js/theme.js?v=2"></script>
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
        .auth-wrap { width: 100%; max-width: 420px; position: relative; z-index: 1; }
        .auth-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .auth-logo a {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .auth-logo .brand-icon {
            width: auto; height: 44px;
            background: transparent;
            border-radius: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .auth-logo .brand-icon img {
            height: 44px; width: auto; object-fit: contain; display: block;
            border-radius: 10px;
        }
        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 36px 32px;
            box-shadow: var(--shadow-card), 0 0 80px rgba(79,70,229,0.08);
        }
        .auth-title {
            font-family: var(--font-display);
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 6px;
        }
        .auth-sub { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 28px; }
        .auth-footer { text-align: center; margin-top: 20px; font-size: 0.875rem; color: var(--text-muted); }
        #error-msg {
            padding: 12px 14px;
            background: var(--red-glow);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: var(--radius-sm);
            color: var(--red);
            font-size: 0.875rem;
            margin-bottom: 16px;
            display: none;
        }
    </style>
</head>
<body>
<div class="auth-wrap">
    <div class="auth-logo">
        <a href="index.html">
            <div class="brand-icon logo-img"><img src="logo.png" alt="LouageConnect" style="height:44px;width:auto;object-fit:contain;display:block;border-radius:10px;"></div>
            LouageConnect
        </a>
    </div>

    <div class="auth-card">
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-sub">Sign in to your account to continue</p>

        <div id="error-msg"></div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" class="form-input"
                    placeholder="you@example.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-input"
                    placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary w-full btn-lg" id="login-btn"
                style="justify-content:center;margin-top:4px">
                Sign In
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="register.html">Sign up free</a>
        </div>
    </div>
</div>

<div class="toast-container"></div>
<script src="js/utils.js"></script>
<script>
    // Redirect if already logged in
    document.addEventListener('DOMContentLoaded', async () => {
        const sess = await API.session();
        if (sess.loggedIn) redirectByRole(sess.user.role);
    });

    async function handleLogin(e) {
        e.preventDefault();
        const email    = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const btn      = document.getElementById('login-btn');
        const errDiv   = document.getElementById('error-msg');

        btn.disabled = true;
        btn.textContent = 'Signing in…';
        errDiv.style.display = 'none';

        const res = await API.login(email, password);

        if (res.success) {
            showToast('Welcome back, ' + res.user.name + '!', 'success');
            setTimeout(() => redirectByRole(res.user.role), 800);
        } else {
            errDiv.textContent = res.error || 'Login failed';
            errDiv.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Sign In';
        }
    }

    function redirectByRole(role) {
        if (role === 'admin')  window.location.href = 'admin/index.html';
        else if (role === 'driver') window.location.href = 'driver/index.html';
        else window.location.href = 'dashboard.html';
    }
</script>
</body>
</html>
