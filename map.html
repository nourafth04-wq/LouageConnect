<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Map — LouageConnect</title>
    <link rel="stylesheet" href="css/main.css?v=2">
    <link rel="stylesheet" href="css/map.css?v=2">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="js/theme.js?v=2"></script>
    <style>
        body { overflow: hidden; }
        #map {
            position: fixed;
            inset: 0;
            top: 64px;
            z-index: 1;
        }
        .map-hud {
            position: fixed;
            top: 76px;
            left: 16px;
            z-index: 400;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .hud-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: rgba(11,18,37,0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 100px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
            box-shadow: 0 2px 12px rgba(0,0,0,0.4);
        }
        .map-legend {
            position: fixed;
            bottom: 24px;
            left: 16px;
            z-index: 400;
            background: rgba(11,18,37,0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: var(--radius-md);
            padding: 14px 18px;
            font-size: 0.78rem;
        }
        .legend-title { font-weight: 700; color: var(--text-secondary); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.7rem; }
        .legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; color: var(--text-secondary); }
        .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
        .sidebar-toggle {
            position: fixed;
            top: 76px;
            right: 16px;
            z-index: 450;
            width: 40px; height: 40px;
            background: rgba(11,18,37,0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: var(--text-secondary);
            font-size: 16px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: var(--transition);
        }
        .sidebar-toggle:hover { background: rgba(79,70,229,0.3); color: #fff; }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
    <a href="index.html" class="nav-brand">
        <div class="brand-icon logo-img"><img src="logo.png" alt="LouageConnect" style="height:36px;width:auto;object-fit:contain;display:block;border-radius:8px;"></div>
        LouageConnect
    </a>
    <ul class="nav-links">
        <li><a href="dashboard.html">Louages</a></li>
        <li><a href="map.html" class="active">Live Map</a></li>
    </ul>
    <div class="nav-actions">
        <div class="live-indicator"><div class="live-dot"></div> <span id="live-count">…</span></div>
        <span id="nav-username" class="text-sm text-secondary hidden"></span>
        <a id="nav-admin"  href="admin/index.html"  class="btn btn-ghost btn-sm hidden">Admin</a>
        <a id="nav-driver" href="driver/index.html" class="btn btn-ghost btn-sm hidden">Driver Panel</a>
        <a id="nav-login"  href="login.html"        class="btn btn-ghost btn-sm">Login</a>
        <a id="nav-logout" href="php/logout.php"    class="btn btn-ghost btn-sm hidden">Logout</a>
    </div>
</nav>

<!-- HUD Info Pills -->
<div class="map-hud">
    <div class="hud-pill">🗺️ Tunisia — All active routes</div>
    <div class="hud-pill" id="hud-update">↺ Updating every 4s</div>
</div>

<!-- Sidebar Toggle -->
<button class="sidebar-toggle" onclick="toggleSidebar()" title="Toggle sidebar">☰</button>

<!-- The Map -->
<div id="map"></div>

<!-- Sidebar -->
<div id="map-sidebar" class="map-sidebar">
    <div class="sidebar-header">
        <span class="sidebar-title">Active Louages</span>
        <div class="live-indicator" style="font-size:0.7rem"><div class="live-dot"></div>Live</div>
    </div>
    <div id="sidebar-list">
        <div style="text-align:center;padding:32px;color:var(--text-muted)">
            <div class="spinner" style="margin:0 auto 12px"></div>
            Loading…
        </div>
    </div>
</div>

<!-- Legend -->
<div class="map-legend">
    <div class="legend-title">Status Legend</div>
    <div class="legend-row"><div class="legend-dot" style="background:#F59E0B"></div> Waiting for passengers</div>
    <div class="legend-row"><div class="legend-dot" style="background:#EF4444"></div> Full — about to depart</div>
    <div class="legend-row"><div class="legend-dot" style="background:#22C55E;box-shadow:0 0 8px #22C55E55"></div> Moving — en route</div>
</div>

<div class="toast-container"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/utils.js"></script>
<script src="js/map.js"></script>
</body>
</html>
